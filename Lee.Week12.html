<!doctype html>

<head>
<meta charset="utf-8">
<title>ADSR Delay Voice</title>
<style>body{background:#fff;color:#000}</style>

  </head>
    <body>

<button id="trig" type="button">Synth1</button>
<button id="trig2" type="button">Synth2</button>

<p>
Delay(1) <input id="Time" type="range" step="0.01" min="0.01" max="0.75" value="15">
<br>
Feedback(1) <input id="fb" type="range" min="55" max="89" value="0.5">
<br>
Delay(2)<input id="Time2" type="range" step="0.01" min="0.01" max="0.5" value="0.1">
<br>
Feedback(2)<input id="fb2" type="range" min="55" max="89" value="0.5">


<script>

const ctx = new AudioContext();

const master = new GainNode(ctx)
master.gain.value = 0.1;


const delay = new DelayNode(ctx, { maxDelayTime: 2.5})

delay.delayTime = 0.35

const feedback = new GainNode(ctx)
feedback.gain.value = 0.5;

const DelFilter = new BiquadFilterNode(ctx)
DelFilter.type = "lowpass"
DelFilter.frequency.value = 1500;


delay.connect(feedback);
feedback.connect(DelFilter);
DelFilter.connect(delay);


delay.connect(master);
master.connect(ctx.destination);

// Everything above is built once. The code below runs on every click
// and builds a brand new note each time.
function playNote(frequency, filterCutOff) 

{
  ctx.resume();

  // "Now" on the audio clock. All the timings below are offsets from this.
  const t = ctx.currentTime;


  const osc1 = new OscillatorNode(ctx);
  osc1.type = "square";
  osc1.frequency.value = frequency;

  const osc2 = new OscillatorNode(ctx);
  osc2.type = "sine";
  osc2.frequency.value = frequency*2.04;

  const filter = new BiquadFilterNode(ctx);
  filter.type = "lowpass"
  filter.frequency.value = frequency * filterCutOff*2/3;
  filter.Q = 50

  const filterLFO = new OscillatorNode(ctx);
  filterLFO.type = "sine";
  filterLFO.frequency.value = 0

  const LFOdepth = new GainNode(ctx);
  LFOdepth.gain.value = (frequency * filterCutOff)*1/3

  filterLFO.connect(LFOdepth);
  LFOdepth.connect(filter.frequency);

  const dur = 3
  const env = new GainNode(ctx)
  env.gain.value = 0;

  env.gain.setValueAtTime(0, t);                     // start silent
  env.gain.linearRampToValueAtTime(1, t + dur*0.003);     // Attack
  env.gain.exponentialRampToValueAtTime(0.3, t + dur*0.1);    // Decay
  //env.gain.setValueAtTime(0.2, t + dur*0.9);             // Sustain
  env.gain.exponentialRampToValueAtTime(0.001, t + dur*0.999);  
  env.gain.linearRampToValueAtTime(0.001, t+dur);    // Release

  filterLFO.frequency.setValueAtTime(0,t);
  filterLFO.frequency.linearRampToValueAtTime(11, t+dur*0.005);
  filterLFO.frequency.exponentialRampToValueAtTime(4, t+dur*0.8);
  filterLFO.frequency.linearRampToValueAtTime(0, t+dur);

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(env);
  env.connect(master);  // straight to the speakers (the "dry" sound)
  env.connect(delay);   // into the delay loop (the echoes, or "wet" sound)

  // Start the tone now, and stop it just after the release has finished.
  // A stopped node with nothing referring to it is cleaned up by the browser.
  osc1.start(t);
  osc2.start(t);
  filterLFO.start(t);
  osc1.stop(t + dur);
  osc2.stop(t+dur);
  filterLFO.stop(t + dur);
};

   // 1. Define the array of choices
        const midiPitches = [52, 54, 56, 58, 59, 61, 62, 64];

        // 2. Create the random picker function
        const randomPitch = function() {
            let randomMidiNote = midiPitches[Math.floor(Math.random() * midiPitches.length)];
            
            let newFreq = 440 * 2 ** ((randomMidiNote - 69) / 12);

            return newFreq;
        }

        const MultArray = [10, 15, 20, 30]
        const filterFreq = function()
            {
                let filterMult = MultArray[Math.floor(Math.random() * MultArray.length)];
              

                return filterMult
                        }

  document.querySelector("#trig").onclick = () => playNote(randomPitch(), filterFreq());

const master2 = new GainNode(ctx)
master2.gain.value = 0.1;


const delay2 = new DelayNode(ctx, { maxDelayTime: 2.5})

delay2.delayTime = 0.25

const feedback2 = new GainNode(ctx)
feedback2.gain.value = 0.5;

const DelFilter2 = new BiquadFilterNode(ctx)
DelFilter2.type = "highpass"
DelFilter2.frequency.value = 1500;


delay2.connect(feedback2);
feedback2.connect(DelFilter2);
DelFilter2.connect(delay2);


delay2.connect(master2);
master2.connect(ctx.destination);




function playNote2(frequency2, filterCutOff2, modRate, modDepth) 
{

  ctx.resume();

  // "Now" on the audio clock. All the timings below are offsets from this.
  const t = ctx.currentTime;

  const carrier = new OscillatorNode(ctx);
  carrier.frequency.value = frequency2;

  const mod = new OscillatorNode(ctx);
  mod.type = "sine";
  mod.frequency.value=frequency2*modRate

  const modgain = new GainNode(ctx);
  modgain.gain.value = frequency2*modDepth

  const filter = new BiquadFilterNode(ctx);
  filter.type = "lowpass"
  filter.frequency.value = 2500;
  filter.Q = 50

  const filterLFO = new OscillatorNode(ctx);
  filterLFO.type = "sine";
  filterLFO.frequency.value = 4 

  const LFOdepth = new GainNode(ctx);
  LFOdepth.gain.value = 800

  filterLFO.connect(LFOdepth);
  LFOdepth.connect(filter.frequency);

  const dur = 2
  const env = new GainNode(ctx)
  env.gain.value = 0;

  env.gain.setValueAtTime(0, t);                     // start silent
  env.gain.linearRampToValueAtTime(1, t + dur*0.5);     // Attack
  env.gain.linearRampToValueAtTime(0.3, t + dur*0.55);    // Decay
  //env.gain.setValueAtTime(0.2, t + dur*0.9);             // Sustain
  env.gain.linearRampToValueAtTime(0, t + dur);      // Release

  mod.connect(modgain);
  modgain.connect(carrier.frequency);
  carrier.connect(filter);
  filter.connect(env);
  env.connect(master2);  // straight to the speakers (the "dry" sound)
  env.connect(delay2);   // into the delay loop (the echoes, or "wet" sound)

  // Start the tone now, and stop it just after the release has finished.
  // A stopped node with nothing referring to it is cleaned up by the browser.
  carrier.start(t);
  mod.start(t);
  filterLFO.start(t);
  carrier.stop(t + dur);
  mod.stop(t+dur);
  filterLFO.stop(t + dur);

};


const midipitches2 = [40, 47, 52, 59, 64]  

let newpitch = function() {
            let randomMidiNote = midipitches2[Math.floor(Math.random() * midipitches2.length)];
            
            let newFreq = 440 * 2 ** ((randomMidiNote - 69) / 12);

            return newFreq;
        }


const FmMultipliers = [0.25, 0.5, 1.5, 1.75, 2, 2.5, 3, 3.5, 4, 4.01, 5, 6.66, 8]

let modmult = function() {
let randomMult = FmMultipliers[Math.floor(Math.random()* FmMultipliers.length)];
return randomMult;
};

ModDepthValues = [1, 2, 4, 5, 7, 10, 12, 15, 20]

let modamt = function() {
let randomMult = ModDepthValues[Math.floor(Math.random()* ModDepthValues.length)];
return randomMult;
};

 
document.querySelector("#trig2").onclick = () => playNote2(newpitch(), 500, modmult(), modamt());
       

// Delay time slider


document.getElementById('Time').addEventListener('input', function (e) {
  delay.delayTime.setTargetAtTime((e.target.value), ctx.currentTime, 0.02);
});

// Feedback slider.
document.getElementById('fb').addEventListener('input', function (e) {
  feedback.gain.setTargetAtTime((e.target.value**2)/10000, ctx.currentTime, 0.02);
});

document.getElementById('Time2').addEventListener('input', function (e) {
  delay2.delayTime.setTargetAtTime((e.target.value), ctx.currentTime, 0.02);
});

// Feedback slider.
document.getElementById('fb2').addEventListener('input', function (e) {
  feedback2.gain.setTargetAtTime((e.target.value**2)/10000, ctx.currentTime, 0.02);
});


</script>

</body>
</html>
