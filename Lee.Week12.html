<!doctype html>

<head>
<meta charset="utf-8">
<title>ADSR Delay Voice</title>
<style>body{background:#fff;color:#000}</style>

  </head>
    <body>

<button id="trig" type="button">Synth1</button>
<button id="trig2" type="button">Synth2</button>

<p>
Delay time(1) <input id="Time" type="range" step="0.01" min="0.01" max="0.75" value="15">
<br>
Feedback(1) <input id="fb" type="range" min="55" max="89" value="0.5">
<br>
Mod Speed(1) <input id="mod" type="range" step="0.1" min="0.5" max="11" value="2">
</p>
FM(2) <input id="fm" type="range" step="1" min="1" max="16" value="2">
FM Depth(2) <input id="fmDepth" type="range" step="1" min="1" max="20" value="4">


<script>

const ctx = new AudioContext();

const master = new GainNode(ctx)
master.gain.value = 0.1;


const delay = new DelayNode(ctx, { maxDelayTime: 2.5})

delay.delayTime = 0.35

const feedback = new GainNode(ctx)
feedback.gain.value = 0.5;

const DelFilter = new BiquadFilterNode(ctx)
DelFilter.type = "lowpass"
DelFilter.frequency.value = 1500;


delay.connect(feedback);
feedback.connect(DelFilter);
DelFilter.connect(delay);


delay.connect(master);
master.connect(ctx.destination);

// Everything above is built once. The code below runs on every click
// and builds a brand new note each time.
function playNote(frequency, filterCutOff) 

{
  ctx.resume();

  // "Now" on the audio clock. All the timings below are offsets from this.
  const t = ctx.currentTime;


  const osc1 = new OscillatorNode(ctx)
  osc1.type = "square";
  osc1.frequency.value = frequency;

  const filter = new BiquadFilterNode(ctx);
  filter.type = "lowpass"
  filter.frequency.value = frequency * filterCutOff*2/3;
  filter.Q = 50

  const filterLFO = new OscillatorNode(ctx);
  filterLFO.type = "sine";
  filterLFO.frequency.value = 2 

  const LFOdepth = new GainNode(ctx);
  LFOdepth.gain.value = (frequency * filterCutOff)*2/3

  filterLFO.connect(LFOdepth);
  LFOdepth.connect(filter.frequency);

  const dur = 0.5
  const env = new GainNode(ctx)
  env.gain.value = 0;

  env.gain.setValueAtTime(0, t);                     // start silent
  env.gain.linearRampToValueAtTime(1, t + dur*0.01);     // Attack
  env.gain.linearRampToValueAtTime(0.3, t + dur*0.55);    // Decay
  //env.gain.setValueAtTime(0.2, t + dur*0.9);             // Sustain
  env.gain.linearRampToValueAtTime(0, t + dur);      // Release

  osc1.connect(filter);
  filter.connect(env);
  env.connect(master);  // straight to the speakers (the "dry" sound)
  env.connect(delay);   // into the delay loop (the echoes, or "wet" sound)

  // Start the tone now, and stop it just after the release has finished.
  // A stopped node with nothing referring to it is cleaned up by the browser.
  osc1.start(t);
  filterLFO.start(t);
  osc1.stop(t + dur);
  filterLFO.stop(t + dur);

  document.getElementById('mod').addEventListener('input', function (e) {
    filterLFO.frequency.setTargetAtTime(e.target.value, ctx.currentTime, 0.02)
});
};

   // 1. Define the array of choices
        const midiPitches = [52, 54, 56, 58, 59, 61, 62, 64];

        // 2. Create the random picker function
        const randomPitch = function() {
            let randomMidiNote = midiPitches[Math.floor(Math.random() * midiPitches.length)];
            
            let newFreq = 440 * 2 ** ((randomMidiNote - 69) / 12);

            return newFreq;
        }

        const MultArray = [10, 15, 20, 30]
        const filterFreq = function()
            {
                let filterMult = MultArray[Math.floor(Math.random() * MultArray.length)];
              

                return filterMult
                        }

  document.querySelector("#trig").onclick = () => playNote(randomPitch(), filterFreq());

const master2 = new GainNode(ctx)
master2.gain.value = 0.1;


const delay2 = new DelayNode(ctx, { maxDelayTime: 2.5})

delay2.delayTime = 0.25

const feedback2 = new GainNode(ctx)
feedback2.gain.value = 0.5;

const DelFilter2 = new BiquadFilterNode(ctx)
DelFilter2.type = "lowpass"
DelFilter2.frequency.value = 1500;


delay2.connect(feedback2);
feedback2.connect(DelFilter2);
DelFilter2.connect(delay2);


delay2.connect(master2);
master2.connect(ctx.destination);

  const t = ctx.currentTime;


  carrier.frequency.value = frequency2;

  const mod = new OscillatorNode(ctx);
  mod.type = "sine";
  mod.frequency.value=frequency2*2

  const modDepth = new GainNode(ctx);
  modDepth.gain.value = frequency2*4

  filterLFO.type = "sine";

document.querySelector("#trig2").onclick = () => playNote2(263, 500)
       

// Delay time slider


document.getElementById('Time').addEventListener('input', function (e) {
  delay.delayTime.setTargetAtTime((e.target.value), ctx.currentTime, 0.02);
});

// Feedback slider.
document.getElementById('fb').addEventListener('input', function (e) {
  feedback.gain.setTargetAtTime((e.target.value**2)/10000, ctx.currentTime, 0.02);

</script>

</body>
