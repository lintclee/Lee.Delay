<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>3X3 Colored Button Grid</title>
        <style>
            button-grid{
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
                max-width: 600px
                margin: 40px auto;
            }
            .btn {
        padding: 16px 20px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        border: none;
        border-radius: 100px;
        cursor: pointer;
        transition: opacity 0.2s ease;
    }
    .btn:hover {
        opacity:0.85;
    }
            
    .btn-1 { background-color: #3fe639; } /* Red */
    .btn-2 { background-color: #f4a261; } /* Orange */
    .btn-3 { background-color: #e9c46a; color: #222; } /* Yellow with dark text */
    .btn-4 { background-color: #2a9d8f; } /* Teal */
    .btn-5 { background-color: #457b9d; } /* Steel Blue */
    .btn-6 { background-color: #1d3557; } /* Navy */
    .btn-7 { background-color: #8338ec; } /* Purple */
    .btn-8 { background-color: #ff006e; } /* Magenta */
    .btn-9 { background-color: #38b000; } /* Green */
        </style>
    </head>
</html>
